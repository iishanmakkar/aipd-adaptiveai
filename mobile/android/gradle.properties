org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-exports=java.base/jdk.internal.ref=ALL-UNNAMED --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.java.home=C:/Java/jdk-17
android.useAndroidX=true
android.enableJetifier=true
# expo.jsEngine drives app/build.gradle; hermesEnabled is what `expo export` checks
# against app.json (see @expo/cli build/src/export/exportHermes.js). Both must agree.
expo.jsEngine=hermes
hermesEnabled=true
# AGP 8.4 predates compileSdk 36 (Android 16) / 37 (Android 17); the platform still
# compiles fine, so silence the "untested compile SDK" nag instead of downgrading.
android.suppressUnsupportedCompileSdk=36,37
# The manifest sets android:extractNativeLibs="true" (Expo SDK 51's prebuilt .so files
# are 4 KB aligned and are unpacked by the installer). AGP derives that attribute from
# useLegacyPackaging, so leaving it false made Gradle and the manifest disagree and
# warned on every packageRelease. true = store compressed + extract, which matches.
expo.useLegacyPackaging=true
