<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwiftRail — Book Train Tickets (demo, monitored)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input, select { display: block; width: 100%; padding: .5rem; margin-top: .25rem; }
  button { margin-top: 1.25rem; padding: .6rem 1.2rem; font-size: 1rem; }
  .error { color: #b00020; font-weight: 600; margin-top: .25rem; }
  #confirmation { display: none; margin-top: 1.5rem; border: 2px solid green; padding: 1rem; }
</style>
</head>
<body>
<main>
<h1>SwiftRail ticket booking</h1>
<p>Demo form for the AdaptiveAI live monitor (Round 9). Validation errors
appear as visible text so a change-detection gate can see them.</p>
<form id="booking" action="#" method="post" novalidate>
  <label for="pname">Passenger name (required)</label>
  <input id="pname" name="pname" type="text" placeholder="Asha Sharma">
  <div id="err-name" class="error" role="alert"></div>

  <label for="pemail">Email address</label>
  <input id="pemail" name="pemail" type="email" placeholder="asha@example.com">
  <div id="err-email" class="error" role="alert"></div>

  <label for="seats">Seats</label>
  <select id="seats" name="seats">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
  </select>
  <div id="err-seats" class="error" role="alert"></div>

  <fieldset>
    <legend>Class</legend>
    <label><input type="radio" name="cls" value="sleeper" checked> Sleeper</label>
    <label><input type="radio" name="cls" value="ac3"> AC 3-tier</label>
  </fieldset>

  <div id="ac-options" style="display:none">
    <label for="meal">Meal preference (AC only)</label>
    <select id="meal" name="meal">
      <option value="veg">Vegetarian</option>
      <option value="nonveg">Non-vegetarian</option>
    </select>
  </div>

  <button type="submit">Book tickets</button>
</form>
<div id="confirmation" role="status"></div>
</main>
<script>
document.getElementById('booking').addEventListener('submit', function (ev) {
  ev.preventDefault();
  const get = (id) => document.getElementById(id).value;
  const setErr = (id, msg) => { document.getElementById(id).textContent = msg; };
  setErr('err-name', ''); setErr('err-email', ''); setErr('err-seats', '');
  let bad = false;
  if (!get('pname').trim()) { setErr('err-name', 'Please enter the passenger name.'); bad = true; }
  if (get('pemail') && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(get('pemail'))) {
    setErr('err-email', 'That email address does not look valid.'); bad = true;
  }
  if (parseInt(get('seats'), 10) > 3) {
    setErr('err-seats', 'Only 3 seats remain on this train. Please choose 3 or fewer.'); bad = true;
  }
  if (bad) return;
  const ref = 'PNR' + Math.abs([...get('pname')].reduce((a, c) => a + c.charCodeAt(0), 0) % 900000 + 100000);
  const box = document.getElementById('confirmation');
  box.style.display = 'block';
  box.textContent = 'Booked ' + get('seats') + ' seat(s) for ' + get('pname') +
    ' (' + get('pemail') + '). Reference ' + ref + '.';
});
// Class radios reveal the AC-only meal field: a real "new field appears" event.
document.querySelectorAll('input[name="cls"]').forEach((radio) => {
  radio.addEventListener('change', () => {
    document.getElementById('ac-options').style.display =
      document.querySelector('input[name="cls"]:checked').value === 'ac3' ? 'block' : 'none';
  });
});
</script>
</body>
</html>
