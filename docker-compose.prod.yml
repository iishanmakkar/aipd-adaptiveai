# Production overlay: expose ONLY the frontend and the public API.
# intent-engine / agents / browser-agent / postgres stay on the internal
# compose network (the browser-agent drives live Chromium - it must never be
# reachable by untrusted callers; SSRF guard is the second layer, not the only one).
# The backend also drops its dev bind-mounts here: prod runs the baked image,
# not the working tree. Redis stays internal-only (ports reset above); it
# holds TTL caches only, so add --requirepass + a REDIS_URL credential when
# the network stops being a single trusted host.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  intent-engine:
    ports: !reset []
  agents:
    ports: !reset []
    # Prod must not leak the dev FAISS tree in or write prod data to it:
    # without a mount the service re-seeds its knowledge base on start.
    volumes: !reset []
  browser-agent:
    ports: !reset []
    # Production never lets the server-side browser reach internal hosts: the
    # dev file turns this on so the bundled demo/intranet pages are testable.
    environment:
      - ADAPTIVEAI_ALLOW_LOCAL_TARGETS=0
  frontend:
    # Production serves the static production bundle (built with the real API
    # origin baked in), never the Vite dev server: HMR, source maps and the
    # file watcher must not ship. Build with the API origin exported:
    #   VITE_API_BASE_URL=https://api.example.com docker compose \
    #     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set for production builds}
    command: sh -c "npm run build && npx vite preview --host 0.0.0.0 --port 5173"
  backend:
    # No --reload in production: WatchFiles restarts the worker on bind-mount
    # mtime noise (observed as a reload loop refusing connections on WSL2).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes: !reset []
    # The production guards in app.main refuse to boot unless these hold:
    # DEBUG must be False (set in backend/.env), JWT_SECRET a real secret,
    # FRONTEND_URL the real origin, ALLOWED_HOSTS the served hostnames.
    environment:
      - ADAPTIVEAI_PRODUCTION=1
      - ADAPTIVEAI_ALLOW_LOCAL_TARGETS=0
