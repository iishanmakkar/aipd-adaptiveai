services:
  # Postgres DB for Backend (real persistence)
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adaptiveai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: shared session/pending/narration store (Phase 2.3). Services fall
  # back to in-memory TTL stores when REDIS_URL is unset, so local dev
  # without redis still boots.
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Intent & Context Engine (Kakul) - port 8001 - REAL LLM via NIM
  intent-engine:
    restart: unless-stopped
    build: ./intent-engine
    ports:
      - "8001:8001"
    env_file:
      - path: ./intent-engine/.env
        required: false
    environment:
      - PORT=8001
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Task Agents + RAG (Kartik) - port 8002 - REAL FAISS + NIM
  agents:
    restart: unless-stopped
    build: ./agents
    ports:
      - "8002:8002"
    env_file:
      - path: ./agents/.env
        required: false
    environment:
      - PORT=8002
      - HOST=0.0.0.0
    volumes:
      - ./agents/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Backend (Ishan) - Main API with orchestration, DB, Policy Engine - port 8000 - REAL DB + orchestration
  backend:
    restart: unless-stopped
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      intent-engine:
        condition: service_healthy
      agents:
        condition: service_healthy
      browser-agent:
        condition: service_healthy
    # DEV ONLY: --reload for local iteration. Production overlay
    # (docker-compose.prod.yml) overrides this with plain uvicorn.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      # The runtime image deliberately ships no test suite or test deps, so
      # without this mount `docker compose exec backend python -m pytest` finds
      # zero tests and exits 5 - which reads like a pass unless you check the
      # exit code. Mounted read-only; see scripts/verify.sh.
      - ./backend/tests:/app/tests:ro
      # Also absent from the image, and it is what sets asyncio_mode = auto.
      # Without it every async test fails as "async def functions are not
      # natively supported", which looks like a codebase of 46 broken tests.
      - ./backend/pytest.ini:/app/pytest.ini:ro
    environment:
      - INTENT_SERVICE_URL=http://intent-engine:8001
      - AGENT_SERVICE_URL=http://agents:8002
      - BROWSER_SERVICE_URL=http://browser-agent:8003
      - SUPABASE_DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/adaptiveai
      - REDIS_URL=redis://redis:6379/0
      # Dev/demo only: lets the browser drive pages on the compose network and
      # the host (the included ticket-booking demo, an intranet form, a replay
      # test). Cloud metadata stays refused; docker-compose.prod.yml pins this
      # back to 0 - see app/api/url_guard.py.
      - ADAPTIVEAI_ALLOW_LOCAL_TARGETS=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Browser Agent (real Playwright navigation + form filling) - port 8003
  browser-agent:
    restart: unless-stopped
    build: ./browser-agent
    ports:
      - "8003:8003"
    env_file:
      - path: ./browser-agent/.env
        required: false
    environment:
      - NIM_BASE_URL=https://integrate.api.nvidia.com/v1
      - NIM_MODEL=meta/llama-3.2-11b-vision-instruct
      # Must match the backend's setting: the guard is duplicated per image
      # because these services share no package.
      - ADAPTIVEAI_ALLOW_LOCAL_TARGETS=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Frontend (Ishika) - React + Vite - port 5173 - REAL API (no mocks)
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      # Baked into the bundle at BUILD time (Vite semantics): the default
      # matches local dev; production passes its real origin via the prod
      # overlay (which fails fast when it is unset).
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      # In-container Vite proxy target: localhost here is the frontend
      # container itself, so proxied /api + /v1 traffic goes to the backend
      # service (see vite.config.ts). Plain local `npm run dev` ignores this.
      - VITE_PROXY_TARGET=http://backend:8000
      # No NIM key here on purpose: any VITE_* var is baked into the public JS
      # bundle. Vision requests go through the backend proxy (POST /v1/chat/completions),
      # which authenticates with NIM_API_KEY from backend/.env server-side.
    command: npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      # 127.0.0.1, not localhost: Vite binds 0.0.0.0 (IPv4 only) while
      # busybox wget resolves "localhost" to ::1 and reports connection refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # The demo pages, served over http so a real browser session can be pointed
  # at them by URL. This is what makes the documented ticket-booking flow work
  # as written (paste http://demo-forms:8080/book-tickets.html in the chat, or
  # http://localhost:8080/... from the host) instead of only as a data: URL in a
  # proof script. Opt-in: `docker compose --profile demo up -d`, and never in
  # the prod overlay, which pins ADAPTIVEAI_ALLOW_LOCAL_TARGETS=0.
  demo-forms:
    image: python:3.11-alpine
    profiles: ["demo"]
    restart: unless-stopped
    command: python -m http.server 8080 --bind 0.0.0.0 --directory /demo
    volumes:
      - ./demo:/demo:ro
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data: