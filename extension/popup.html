<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AdaptiveAI</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; width: 260px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    ul { list-style: none; margin: 0 0 10px; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
    button { font: inherit; padding: 6px 10px; width: 100%; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
    .warn { color: #b00020; font-weight: 600; }
    label { display: block; font-size: 13px; margin: 10px 0 2px; }
    input[type=text] { font: inherit; width: 100%; box-sizing: border-box; padding: 6px; }
    ol { margin: 8px 0; padding-left: 20px; }
    li.step { display: block; }
    .ask { border: 2px solid #b00020; padding: 8px; margin: 8px 0; }
  </style>
</head>
<body>
  <main>
    <h1>AdaptiveAI</h1>
    <p id="status" role="status" aria-live="polite">Reading this page…</p>
    <ul id="report" hidden>
      <li><span>Controls I can act on</span><span id="interactive">0</span></li>
      <li><span>Controls with no name</span><span id="unnamed" class="warn">0</span></li>
      <li><span>Images without alt text</span><span id="missing-alt" class="warn">0</span></li>
    </ul>

    <!-- Typed goal: the keyboard route to the same loop the voice path drives.
         A blind user with NVDA can fill this in, and a sighted helper can too. -->
    <label for="goal">What should I do on this page?</label>
    <input type="text" id="goal" autocomplete="off"
           placeholder="Book two seats for the 7pm show">
    <button type="button" id="run">Run it</button>

    <div id="ask" class="ask" hidden>
      <p id="ask-text" role="alert"></p>
      <button type="button" id="yes">Yes, do it</button>
      <button type="button" id="no">No, stop</button>
    </div>

    <h2 id="transcript-title" hidden>What happened</h2>
    <ol id="transcript" aria-labelledby="transcript-title"></ol>
    <p id="transcript-note" role="status" aria-live="polite"></p>

    <button type="button" id="recheck">Re-read this page</button>
    <button type="button" id="setup">Set up my details</button>
  </main>
  <script src="src/popup.js"></script>
</body>
</html>
