<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AdaptiveAI</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; width: 260px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    ul { list-style: none; margin: 0 0 10px; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
    button { font: inherit; padding: 6px 10px; width: 100%; }
    button:focus-visible, a:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
    .warn { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>AdaptiveAI</h1>
    <p id="status" role="status" aria-live="polite">Reading this page…</p>
    <ul id="report" hidden>
      <li><span>Controls I can act on</span><span id="interactive">0</span></li>
      <li><span>Controls with no name</span><span id="unnamed" class="warn">0</span></li>
      <li><span>Images without alt text</span><span id="missing-alt" class="warn">0</span></li>
    </ul>
    <button type="button" id="recheck">Re-read this page</button>
  </main>
  <script src="src/popup.js"></script>
</body>
</html>
