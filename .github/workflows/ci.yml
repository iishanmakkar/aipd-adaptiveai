name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one run per branch at a time; a newer push supersedes an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intent-engine:
    name: Intent engine (offline unit + API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: intent-engine/requirements*.txt
      - run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest

  agents:
    name: Task agents + RAG (offline, stubbed model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agents/requirements*.txt
      - name: Install CPU-only torch first (avoids ~3GB of CUDA wheels)
        run: pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest

  backend:
    name: Backend (offline unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest

  backend-db:
    name: Backend against real Postgres
    runs-on: ubuntu-latest
    # Proves the SQLAlchemy models, UUID columns and ownership checks work on
    # an actual database - the part no test previously covered.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adaptiveai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/adaptiveai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -m live

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Assert component + accessibility styles are bundled
        run: |
          shopt -s nullglob
          css=(dist/assets/*.css)
          [ ${#css[@]} -gt 0 ] || { echo "no CSS emitted"; exit 1; }
          bytes=$(wc -c < "${css[0]}")
          echo "bundle: ${css[0]} ($bytes bytes)"
          # components.css + accessibility.css together are ~22KB. If an @import
          # ever drifts back below other rules the browser drops both files and
          # the bundle collapses to main.css alone.
          [ "$bytes" -gt 15000 ] || { echo "styles dropped from bundle ($bytes bytes)"; exit 1; }
          grep -q 'high-contrast' "${css[0]}" || { echo "accessibility styles missing"; exit 1; }
          grep -q 'mic-button' "${css[0]}" || { echo "component styles missing"; exit 1; }

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Config parses (5 services, no env files present)
        run: |
          docker compose config --quiet
          test "$(docker compose config --services | wc -l)" -eq 5
          docker compose config --services | sort | tr '\n' ' '
